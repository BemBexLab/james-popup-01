<!doctype html>
<html lang="en" class="bg-[#f8f6fa] text-[#3f484e]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6fa" />
    <title>Dance Team Battle &middot; Student Creative</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <script defer="" src="index.js"></script>
    <script
      defer=""
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"
    ></script>
  </head>
  <body class="bg-[#f8f6fa] font-[Manrope,Arial,sans-serif] m-0">
    <svg
      data-ui="icon-definitions"
      class="fill-none stroke-current stroke-[1.2] absolute w-0 h-0 overflow-hidden"
      xmlns="http://www.w3.org/2000/svg"
      aria-hidden="true"
    >
      <symbol id="trend" viewBox="0 0 16 16">
        <path d="m2 11 4-4 3 2 5-6m-4 0h4v4"></path>
      </symbol>

      <symbol id="arrow" viewBox="0 0 16 16">
        <path d="m4 12 8-8M5 4h7v7"></path>
      </symbol>
    </svg>

    <main
      data-ui="battle-page"
      class="mx-auto w-[calc(100%_-_64px)] max-w-[984px] pb-[33px] min-[1168px]:zoom-[clamp(1,calc(100vw/1168px),1.64)] max-[768px]:w-[calc(100%_-_32px)] max-[768px]:max-w-[480px] max-[768px]:pb-6"
      x-data="danceBattle"
      @keydown.escape.window="closeDetails()"
    >
      <header
        data-ui="hero"
        class="relative h-[202px] overflow-hidden max-[1100px]:h-[230px] max-[768px]:h-[300px]"
      >
        <div
          data-ui="hero-copy"
          class="relative z-[2] pt-14 max-[1100px]:pt-9 max-[768px]:pt-6"
        >
          <div
            data-ui="eyebrow"
            class="flex items-center gap-[17px] uppercase text-[22px] font-bold tracking-[4.5px] whitespace-nowrap max-[1000px]:text-[18px] max-[1000px]:tracking-[4px] max-[768px]:text-[13px] max-[768px]:tracking-[3px] max-[768px]:gap-[12px]"
          >
            Student Creative<span
              class="h-[1.8px] w-[143px] bg-[#FFD334] ml-0 max-[1000px]:w-[100px] max-[768px]:w-[55px]"
            ></span>
          </div>
          <h1
            class="m-0 mt-[19px] text-[48px] leading-[1.2] font-black uppercase tracking-[-1.5px] max-[1100px]:max-w-[400px] max-[1100px]:text-[40px] max-[768px]:mt-4 max-[768px]:max-w-none max-[768px]:text-[clamp(28px,7.5vw,36px)]"
          >
            Dance Team
            <span class="text-[#FFD334]">Battle</span>
          </h1>
        </div>
        <div
          data-ui="hero-art"
          class="absolute right-0 top-0 h-[202px] w-[420px] max-[1100px]:right-[-50px] max-[1100px]:top-7 max-[1100px]:opacity-70 max-[768px]:top-auto max-[768px]:bottom-0 max-[768px]:right-0 max-[768px]:h-[165px] max-[768px]:w-[280px] max-[768px]:opacity-100"
          aria-hidden="true"
        >
          <div
            data-ui="yellow-stripe"
            class="absolute bg-[#ffd531] w-[111px] h-[290px] left-[180px] top-[-45px] skew-x-[-16deg] max-[768px]:left-[100px] max-[768px]:w-[80px]"
          ></div>
          <img
            src="assets/Dance.png"
            alt=""
            class="absolute left-[17px] top-[47px] w-[395px] max-w-none opacity-20 max-[768px]:left-0 max-[768px]:top-[65px] max-[768px]:w-[255px]"
          />
          <img
            src="assets/image 4.png"
            alt=""
            class="absolute w-[383px] h-auto left-0 top-[13px] max-[768px]:w-[290px] max-[768px]:left-[-10px] max-[768px]:top-[20px]"
          />
        </div>
      </header>

      <section
        data-ui="battle-stats"
        class="grid grid-cols-[1fr_1.15fr_0.83fr] items-center border border-[#e8e7eb] bg-[#f7f7fb] min-h-[90px] max-[480px]:grid-cols-1 max-[480px]:px-4"
        aria-label="Battle overview"
      >
        <template x-for="stat in stats" :key="stat.id">
          <div
            data-ui="stat"
            class="flex min-w-0 items-center justify-center gap-5 py-3 min-[480px]:h-14 max-[1100px]:gap-2 max-[480px]:justify-start max-[480px]:gap-4 max-[480px]:py-4"
            :class="{ 'border-[#dedee3] min-[480px]:border-l max-[480px]:border-t': stat.id !== 'winning-reward' }"
          >
            <img
              class="w-[29px] h-[29px] object-contain shrink-0 max-[768px]:w-[21px] max-[768px]:h-[21px]"
              :src="stat.iconImage"
              alt=""
            />
            <div>
              <p
                class="text-[12px] leading-[16px] tracking-[-0.35px] mb-[7px] max-[1100px]:text-[11px] max-[1100px]:leading-4 max-[1100px]:mb-1"
                x-text="stat.label"
              ></p>
              <strong
                class="text-[22px] leading-[24px] tracking-[-0.6px] font-bold max-[1100px]:text-[18px] max-[1100px]:leading-6"
                x-text="stat.value"
              ></strong>
            </div>
          </div>
        </template>
      </section>

      <section
        data-ui="matchup"
        class="mx-1 mt-[35px] grid grid-cols-[minmax(0,1fr)_179px_minmax(0,1fr)] items-center max-[1100px]:grid-cols-[minmax(0,1fr)_64px_minmax(0,1fr)] max-[768px]:mx-0 max-[768px]:mt-6 max-[768px]:grid-cols-1 max-[768px]:gap-4"
        aria-label="Competing dance teams"
      >
        <template x-for="(team, index) in teams" :key="team.id">
          <div data-ui="team-entry" class="contents">
            <article
              data-ui="team-card"
              class="min-w-0 border border-[#e8e7eb] bg-[#f6f7f9] px-2 pt-[9px] pb-2 min-[1100px]:h-[272px]"
            >
              <div
                data-ui="team-photo"
                class="relative w-full aspect-[626/216] overflow-hidden"
              >
                <img
                  class="block w-full h-full object-cover"
                  :src="index === 1 ? slides[activeSlide].image : team.image"
                  :alt="index === 1 ? slides[activeSlide].alt : team.imageAlt"
                />
                <span
                  data-ui="creative-index"
                  class="absolute right-[6px] top-[7px] bg-white rounded-[4px] text-[#e6b900] text-[8px] h-[21px] py-[0] px-[5px] flex items-center gap-[5px]"
                  ><svg
                    viewBox="0 0 16 16"
                    class="h-[10px] w-[10px] fill-none stroke-current stroke-[1.2]"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <use href="#trend"></use>
                  </svg>
                  <span x-text="'C-Index: ' + team.creativeIndex"></span>
                </span>
              </div>
              <div
                data-ui="team-description"
                class="mt-[13px] flex min-h-[47px] min-w-0 items-center gap-[23px] max-[1100px]:gap-3"
              >
                <div class="relative h-11 w-11 shrink-0 overflow-hidden">
                  <img
                    data-ui="avatar"
                    class="absolute -left-[2.5px] -top-[2.5px] h-[49px] w-[49px] max-w-none object-cover"
                    :src="team.avatar"
                    :alt="team.creator + ' portrait'"
                  />
                </div>
                <div class="min-w-0">
                  <h2
                    class="text-[14px] leading-5 font-bold tracking-[-0.25px] break-words"
                    x-text="team.title"
                  ></h2>
                  <p
                    class="mt-[3px] text-xs leading-[18px] tracking-[-0.3px] text-[#777] break-words"
                    x-text="team.description"
                  ></p>
                </div>
              </div>
              <div
                data-ui="team-footer"
                class="mt-[27px] flex min-h-8 items-center gap-[17px] max-[1100px]:gap-2 max-[768px]:mt-6"
              >
                <div data-ui="creator" class="mr-auto min-w-0">
                  <h3
                    class="text-[13px] leading-[19px] font-bold tracking-[-0.4px] break-words"
                    x-text="team.creator"
                  ></h3>
                  <p
                    class="text-[11px] text-[#777] leading-[16px]"
                    x-text="team.subscribers"
                  ></p>
                </div>
                <button
                  data-ui="subscribe"
                  class="flex h-6 min-w-[78px] shrink-0 items-center justify-center gap-[5px] border border-[#e3e4e8] bg-transparent px-[5px] text-[11px] leading-[14px] font-semibold whitespace-nowrap hover:bg-[#fff3bb] aria-pressed:bg-[#fff3bb] max-[768px]:h-9 max-[768px]:px-2"
                  type="button"
                  @click="subscribed[index] = !subscribed[index]"
                  :aria-pressed="subscribed[index]"
                >
                  <img
                    data-ui="subscribe-icon"
                    class="w-[8px] h-[9px]"
                    src="assets/Vector.svg"
                    alt=""
                  /><span
                    x-text="subscribed[index] ? 'Subscribed' : team.subscribeLabel"
                  ></span>
                </button>
                <span
                  data-ui="team-count"
                  class="flex h-8 w-[26px] shrink-0 items-center justify-end border-l border-[#e2e3e6] text-[13px] font-bold"
                  :aria-label="`${team.memberCount} team members`"
                  x-text="team.memberCount"
                ></span>
              </div>
            </article>
            <div
              data-ui="versus"
              class="grid h-[57px] w-[57px] place-items-center justify-self-center rounded-[6px] bg-[#FFD334] text-[22px] font-bold max-[768px]:h-11 max-[768px]:w-11 max-[768px]:text-lg"
              x-show="index === 0"
              aria-label="versus"
            >
              VS
            </div>
          </div>
        </template>
      </section>

      <section
        data-ui="battle-resources"
        class="mt-[34px] flex items-center gap-[89px] pl-[172px] max-[1100px]:justify-center max-[1100px]:gap-6 max-[1100px]:pl-0 max-[768px]:mt-6 max-[768px]:flex-col"
        aria-label="Battle media and documents"
      >
        <div
          data-ui="carousel"
          class="flex min-w-0 shrink-0 items-center gap-[18px] max-[768px]:w-full max-[768px]:justify-center max-[768px]:gap-2"
          aria-label="Battle photo gallery"
          @keydown.arrow-left.prevent="changeSlide(-1)"
          @keydown.arrow-right.prevent="changeSlide(1)"
        >
          <button
            data-ui="carousel-arrow previous"
            class="grid h-[21px] w-[21px] shrink-0 place-items-center rounded-full border border-[#ecebef] bg-[#f9fafb] p-0 text-[#ffd531] shadow-[0_6px_14px_#30334420] hover:bg-[#fff2b4] max-[768px]:h-8 max-[768px]:w-8"
            type="button"
            aria-label="Previous photo"
            @click="changeSlide(-1)"
          >
            <svg
              class="block h-[10px] w-[10px]"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m10 3-5 5 5 5" />
            </svg>
          </button>
          <div
            data-ui="thumbnails"
            class="flex min-w-0 items-center gap-[11px] max-[768px]:flex-1 max-[768px]:max-w-[260px] max-[768px]:gap-2"
          >
            <template x-for="(slide, index) in slides" :key="index">
              <button
                data-ui="thumbnail"
                class="block h-[52px] w-[81px] shrink-0 rounded-[4px] border bg-transparent p-[2px] transition-opacity max-[768px]:h-12 max-[768px]:min-w-0 max-[768px]:w-0 max-[768px]:flex-1"
                :class="activeSlide === index ? 'border-[#ffd531] opacity-100' : 'border-[#e5e4e9] opacity-40 hover:opacity-100'"
                type="button"
                :aria-label="'Show battle photo ' + (index + 1)"
                :aria-pressed="activeSlide === index"
                @click="activeSlide = index"
              >
                <img
                  class="block h-full w-full rounded-[3px] object-contain"
                  :src="slide.thumbnail"
                  alt=""
                />
              </button>
            </template>
          </div>
          <button
            data-ui="carousel-arrow"
            class="grid h-[21px] w-[21px] shrink-0 place-items-center rounded-full border border-[#ecebef] bg-[#f9fafb] p-0 text-[#ffd531] shadow-[0_6px_14px_#30334420] hover:bg-[#fff2b4] max-[768px]:h-8 max-[768px]:w-8"
            type="button"
            aria-label="Next photo"
            @click="changeSlide(1)"
          >
            <svg
              class="block h-[10px] w-[10px]"
              viewBox="0 0 16 16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m6 3 5 5-5 5" />
            </svg>
          </button>
        </div>
        <a
          data-ui="pdf-card"
          class="flex h-[68px] w-[208px] shrink-0 items-center gap-[11px] border border-[#e3e2e7] bg-[#f6f7f9] px-[16px] py-[10px] text-[#3f484e] hover:border-[#d5b93e]"
          :href="battleDocument.url"
          :download="battleDocument.filename"
        >
          <svg
            class="block h-[44px] w-[33px] shrink-0"
            viewBox="0 0 33 44"
            aria-hidden="true"
          >
            <path
              d="M6 0h14l13 13v25a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6V6a6 6 0 0 1 6-6Z"
              fill="#f31f2b"
            />
            <path d="M20 0v13h13Z" fill="#ff6270" />
            <text
              x="16.5"
              y="33"
              text-anchor="middle"
              class="fill-white text-[12px] font-extrabold"
            >
              PDF
            </text>
          </svg>
          <span class="min-w-0">
            <small
              class="block whitespace-nowrap text-[11px] leading-[16px] tracking-[-0.3px]"
              x-text="battleDocument.caption"
            ></small>
            <strong
              class="mt-[5px] block whitespace-nowrap text-[18px] font-bold leading-[23px] tracking-[-0.6px]"
              x-text="battleDocument.title"
            ></strong>
          </span>
        </a>
      </section>

      <footer
        data-ui="page-actions"
        class="mt-[35px] flex flex-wrap items-center justify-center gap-3 max-[768px]:mt-6 max-[768px]:gap-2"
      >
        <button
          data-ui="details-button secondary"
          class="inline-flex h-[31px] w-[151px] shrink-0 items-center justify-center gap-[7px] whitespace-nowrap rounded-none border border-[#65666e] bg-transparent p-0 text-[13px] font-semibold leading-none tracking-[-0.4px] text-[#3f484e] hover:bg-[#fff2b4] max-[768px]:h-11 max-[768px]:w-[140px]"
          type="button"
          @click="openDetails($event)"
        >
          <svg
            class="block h-[11px] w-[11px] shrink-0 text-black"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="1"
            aria-hidden="true"
          >
            <circle cx="8" cy="8" r="5.5" />
            <path d="M8 7v4" stroke-linecap="round" />
            <circle cx="8" cy="4.8" r="0.6" fill="currentColor" stroke="none" />
          </svg>
          <span>Battle Details</span>
        </button>
        <button
          data-ui="details-button primary"
          class="inline-flex h-[31px] w-[132px] shrink-0 items-center justify-center gap-[7px] whitespace-nowrap rounded-none border-0 bg-[#ffd531] p-0 text-[13px] font-semibold leading-none tracking-[-0.4px] text-[#3f484e] hover:bg-[#ffe477] max-[768px]:h-11 max-[768px]:w-[125px]"
          type="button"
          @click="openDetails($event)"
        >
          <span>Battle Details</span>
          <svg
            class="block h-[11px] w-[11px] shrink-0"
            viewBox="0 0 16 16"
            fill="none"
            stroke="currentColor"
            stroke-width="0.9"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m4 12 8-8M5 4h7v7" />
          </svg>
        </button>
      </footer>

      <dialog
        x-ref="details"
        data-ui="details-dialog"
        class="m-auto bg-[#f8f6fa] text-[#3f484e] border border-[#e8e7eb] rounded-[8px] w-[min(440px,_calc(100%_-_32px))] max-h-[calc(100dvh_-_32px)] overflow-y-auto p-8 max-[480px]:p-5 shadow-[0_20px_90px_#24203530] backdrop:bg-[#25203080] backdrop:backdrop-blur-[4px]"
        @click="if ($event.target === $el) closeDetails()"
        @close="document.body.style.overflow = ''"
      >
        <button
          data-ui="dialog-close"
          class="text-inherit cursor-pointer focus-visible:outline-2 focus-visible:outline-[#73509a] focus-visible:outline-offset-[4px] transition-colors absolute right-[12px] top-[8px] border-0 bg-transparent text-[27px]"
          type="button"
          aria-label="Close battle details"
          @click="closeDetails()"
        >
          &times;
        </button>
        <p
          data-ui="dialog-eyebrow"
          class="m-0 uppercase tracking-[3px] text-[11px] mb-[12px]"
        >
          Student Creative
        </p>
        <h2 class="m-0 text-[29px]">
          Dance Team
          <span class="text-[#c69c00]">Battle</span>
        </h2>
        <dl class="my-[24px] mx-[0]">
          <template x-for="stat in stats" :key="stat.id">
            <div>
              <dt class="text-sm" x-text="stat.label"></dt>
              <dd class="mt-1 mb-4 text-lg font-bold" x-text="stat.value"></dd>
            </div>
          </template>
        </dl>
        <a
          data-ui="details-button primary"
          class="text-inherit no-underline focus-visible:outline-2 focus-visible:outline-[#73509a] focus-visible:outline-offset-[4px] inline-flex items-center justify-center gap-[7px] h-[32px] text-[14px] tracking-[-0.4px] py-[0] px-[17px] border border-transparent bg-[#ffd531] min-w-[132px] hover:bg-[#ffe477] max-[768px]:text-[13px] max-[768px]:py-[0] max-[768px]:px-[13px] max-[768px]:min-w-[125px]"
          :href="battleDocument.url"
          :download="battleDocument.filename"
          >Download battle details
          <svg
            viewBox="0 0 16 16"
            class="fill-none stroke-current stroke-[1.2] h-[11px] w-[11px]"
          >
            <use href="#arrow"></use></svg
        ></a>
      </dialog>
    </main>
  </body>
</html>
